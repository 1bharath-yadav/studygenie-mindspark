<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <rect width="32" height="32" fill="#ffffff"/>
  <!-- Simple book icon -->
  <rect x="6" y="8" width="20" height="16" rx="1" fill="#2563eb" stroke="#1e40af" stroke-width="0.5"/>
  <!-- Book spine -->
  <line x1="16" y1="8" x2="16" y2="24" stroke="#1e40af" stroke-width="1"/>
  <!-- Book pages -->
  <rect x="7" y="9" width="8" height="14" fill="#ffffff" opacity="0.9"/>
  <rect x="17" y="9" width="8" height="14" fill="#ffffff" opacity="0.9"/>
  <!-- Page lines -->
  <line x1="8" y1="12" x2="14" y2="12" stroke="#64748b" stroke-width="0.5"/>
  <line x1="8" y1="15" x2="14" y2="15" stroke="#64748b" stroke-width="0.5"/>
  <line x1="8" y1="18" x2="14" y2="18" stroke="#64748b" stroke-width="0.5"/>
  <line x1="18" y1="12" x2="24" y2="12" stroke="#64748b" stroke-width="0.5"/>
  <line x1="18" y1="15" x2="24" y2="15" stroke="#64748b" stroke-width="0.5"/>
  <line x1="18" y1="18" x2="24" y2="18" stroke="#64748b" stroke-width="0.5"/>
</svg>
